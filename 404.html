<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; base-uri 'self'; object-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Página não encontrada — Moviki</title>
<link rel="icon" href="/favicon512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/movikiui.css">
<script>window.MOVIKI_VERSAO='2026-08-27-404app';</script>
<script src="/mvmetrica.js"></script>
<style>
/* Rede de seguranca: se o movikiui.css nao carregar, a pagina ainda abre legivel e na marca. */
:root{
  --mv-ciano:#00D4FF;--mv-azul:#0066FF;--mv-grad:linear-gradient(135deg,#00D4FF,#0066FF);
  --mv-bg:#060d18;--mv-surf:#0e1c30;--mv-linha:#1c3457;
  --mv-txt:#eaf6ff;--mv-txt-2:#c6d8ee;--mv-txt-3:#8fa6c4;
  --mv-r:14px;--mv-r-lg:18px;--mv-sombra:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--mv-bg);color:var(--mv-txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;text-align:center}
.marca img{height:36px;margin-bottom:22px}
.card{background:var(--mv-surf);border:1px solid var(--mv-linha);border-radius:var(--mv-r-lg);padding:34px 26px;box-shadow:var(--mv-sombra)}
.cod{font-size:64px;font-weight:800;line-height:1;background:var(--mv-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:21px;font-weight:800;margin:10px 0 8px}
p{font-size:14.5px;color:var(--mv-txt-2);line-height:1.6}
.cam{display:inline-block;max-width:100%;overflow-wrap:anywhere;font-size:12.5px;color:var(--mv-txt-3);background:rgba(0,0,0,.28);border:1px solid var(--mv-linha);border-radius:10px;padding:7px 11px;margin-top:14px}
.acoes{display:grid;gap:10px;margin-top:22px}
a.bt{display:block;text-decoration:none;border-radius:var(--mv-r);padding:13px 16px;font-weight:700;font-size:14.5px}
a.p{background:var(--mv-grad);color:#04121f}
a.s{background:transparent;color:var(--mv-txt-2);border:1px solid var(--mv-linha)}
.pe{margin-top:18px;font-size:12.5px;color:var(--mv-txt-3)}
.pe a{color:var(--mv-txt-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca"><img src="/logo.png" alt="Moviki" onerror="this.outerHTML='<span style=&quot;font-weight:800;font-size:24px&quot;>movi<span style=&quot;color:#00D4FF&quot;>ki</span></span>'"></div>
  <div class="card">
    <div class="cod">404</div>
    <h1>Esta página não existe</h1>
    <p>O endereço que você abriu não faz parte do painel do Moviki. Pode ser um link antigo ou um erro de digitação.</p>
    <div class="cam" id="cam"></div>
    <div class="acoes">
      <a class="bt p" href="/" data-ev="404_painel">Ir para o painel</a>
      <a class="bt s" href="https://moviki.com.br/" data-ev="404_site">Voltar para o site</a>
    </div>
    <div class="pe">Procurando a página de um negócio? Ela fica em <a href="https://moviki.com.br/" data-ev="404_site_publico">moviki.com.br/apelido</a>.</div>
  </div>
</div>
<script>
/* Este arquivo e o 404 REAL do dominio app.moviki.com.br.
   Antes dele, o 404 daqui era uma copia da pagina publica do repo moviki: servia
   codigo velho no dominio errado E disparava pagina_negocio no GA4 pelo host errado.
   Aqui so existe UM evento, com nome proprio, que nao se mistura com o funil. */
(function(){
  try{
    var c = (location.pathname || '/') + (location.search || '');
    document.getElementById('cam').textContent = c.slice(0,120);
    if (window.mvEv) window.mvEv('erro_404', { caminho: c.slice(0,100), origem: document.referrer ? 'link' : 'direto' });
  }catch(e){}
  document.addEventListener('click', function(ev){
    try{
      var a = ev.target && ev.target.closest ? ev.target.closest('a[data-ev]') : null;
      if (a && window.mvEv) window.mvEv('cta_click', { cta: a.getAttribute('data-ev'), pagina: '404_app' });
    }catch(e){}
  }, true);
})();
</script>
</body>
</html>
